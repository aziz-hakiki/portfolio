<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ah-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Background Navy -->
  <rect width="64" height="64" rx="14" fill="url(#ah-bg)"/>
  <!-- Hairline Technical Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Monogram AH -->
  <text x="27" y="43" font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">AH</text>
  <!-- Laravel Crimson Accent Indicator -->
  <circle cx="50" cy="41.5" r="3.5" fill="#DC2626"/>
